name: Draft Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: draft-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  draft:
    name: Build draft release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Build plugin distribution
        run: ./gradlew buildPlugin --no-daemon

      - name: Create or replace version draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(./gradlew properties --quiet --console=plain | sed -n 's/^version: //p')
          test -n "$VERSION"

          RELEASE_NOTES=build/tmp/release-notes.md
          ./gradlew getChangelog \
            --unreleased \
            --no-header \
            --quiet \
            --console=plain \
            --output-file="$RELEASE_NOTES"
          test -s "$RELEASE_NOTES"

          DRAFT_IDS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.draft == true and .tag_name == \"$VERSION\") | .id")
          for DRAFT_ID in $DRAFT_IDS; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID"
          done

          gh release create "$VERSION" \
            build/distributions/*.zip \
            --draft \
            --notes-file "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --title "$VERSION"
