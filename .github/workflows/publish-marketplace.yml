name: Publish to JetBrains Marketplace

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Validate release and Marketplace token
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          test -n "$PUBLISH_TOKEN"
          VERSION=$(./gradlew properties --quiet --console=plain | sed -n 's/^version: //p')
          test "$VERSION" = "$RELEASE_TAG"

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon
