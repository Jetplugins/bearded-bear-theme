name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Generate, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
      - name: Test generator utilities
        run: npm test
      - name: Verify generated themes are current
        run: npm run check:generated
      - name: Test and package plugin
        run: ./gradlew test buildPlugin verifyPluginStructure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bearded-theme-plugin-and-reports
          path: |
            build/distributions/*.zip
            build/reports/**
            build/test-results/**
          if-no-files-found: warn

  compatibility:
    name: Verify on IntelliJ ${{ matrix.ide }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        ide: ["2025.3", "2026.1", "2026.2"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew verifyPlugin -PverifierIdeVersions=${{ matrix.ide }}
